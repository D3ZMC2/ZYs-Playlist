<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZY'S PLAYLIST — Cyberpunk Music Player</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"><div class="sun"></div><div class="city"></div><div class="rain"></div></div><div class="scanlines"></div>
<header><span>● SYSTEM ONLINE</span><span>NC // 2077</span></header>
<main>
<section class="hero">
  <div class="eyebrow">NIGHT CITY // AUDIO TERMINAL</div>
  <h1>ZY<span>'S</span> PLAYLIST</h1>
  <div class="artist">ROSA WALTON // HALLIE COGGINS <span class="track-tag">01 // NOW PLAYING</span></div>
  <div class="art-card">
    <img src="cover.jfif" alt="Music artwork">
    <div class="art-overlay"></div><div class="playing">PLAYING</div>
    <div class="corners"></div>
  </div>
  <div class="status"><span>LIVE TRANSMISSION</span><b id="status">PAUSED</b></div>
</section>
<section class="lyrics-panel">
  <div class="lyrics-head"><span>LYRICS.EXE <small class="scroll-hint">SCROLL // CLICK A LINE TO SEEK</small></span><div><button id="sync" class="sync hidden">SYNC</button><span id="time">00:00</span></div></div>
  <div id="lyrics" class="lyrics" aria-label="Scrollable lyrics"></div>
</section>
</main>
<footer>
 <div class="song"><img src="cover.jfif" alt=""><div><b>I REALLY WANT TO STAY AT YOUR HOUSE</b><small>ROSA WALTON // HALLIE COGGINS</small></div></div>
 <div class="controls"><button id="restart">↺</button><button id="play" class="play">▶</button><button id="mute">🔊</button></div>
 <div class="progress"><span id="current">00:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.01"><span id="duration">04:22</span></div>
</footer>
<audio id="audio" src="song.mp3" preload="metadata"></audio>
<script src="script.js"></script>
</body></html>
